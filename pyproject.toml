[project]
name = "npc-rag"
version = "0.1.0"
description = "Tutorial NPC for LiDollQuest: wiki RAG and reply guards around Sakura's llama.cpp servers"
requires-python = ">=3.10"
dependencies = [
  "fastembed>=0.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.24",
  "langgraph>=1.2,<2",  # Companion pipeline (npc_rag/companion/graph.py); LangChain itself is not used.
]

[project.optional-dependencies]
test = ["pytest>=8"]
decider = ["decider-ai[gguf]==1.9.0"]  # Optional backend requires Python 3.11+; HTTP-only installs still support 3.10.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.package-data]
npc_rag = ["admin_page.html", "student_release.json", "decider_release.json", "decider_config/*.json", "decider_config/*.jinja", "participation_release.json", "participation_config/*.json", "participation_config/*.jinja", "multitask_release.json", "multitask_config/*.json", "multitask_config/*.jinja", "multitask_v2_release.json", "multitask_v2_config/*.json", "multitask_v2_config/*.jinja"]  # Include both releases so installed packages retain v2 rollback.
