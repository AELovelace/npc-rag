[project]
name = "npc-rag"
version = "0.1.0"
description = "Tutorial NPC for LiDollQuest: wiki RAG and reply guards around Sakura's llama.cpp servers"
requires-python = ">=3.10"
dependencies = [
  "fastembed>=0.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.24",
  "langgraph>=1.2,<2",  # Companion pipeline (npc_rag/companion/graph.py); LangChain itself is not used.
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
